# Fly.io configuration for FlightFinder MCP HTTP Server
# Deploy with: fly deploy --config fly.mcp.toml --dockerfile Dockerfile.mcp
#
# This serves the MCP Apps UI for Claude Desktop/Web via HTTP transport.
# Separate from flightfinder-monitor (background worker for price alerts).

app = "flightfinder-mcp"
primary_region = "sjc"  # San Jose, CA - close to SFO searches

[build]
  dockerfile = "Dockerfile.mcp"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false  # Keep warm for fast MCP responses
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
