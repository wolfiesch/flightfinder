[project]
name = "flightfinder"
version = "1.0.0"
description = "Python client for searching flights (Kiwi/Skypicker API) and hotels (Xotelo API)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wolfgang Schoenberger"}]
keywords = ["flights", "travel", "kiwi", "skypicker", "hotels", "xotelo", "mcp", "trip-planning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/wolfgangschoenberger/flightfinder"
Documentation = "https://github.com/wolfgangschoenberger/flightfinder#readme"
Repository = "https://github.com/wolfgangschoenberger/flightfinder"
Changelog = "https://github.com/wolfgangschoenberger/flightfinder/blob/main/CHANGELOG.md"
Issues = "https://github.com/wolfgangschoenberger/flightfinder/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
mcp = [
    "mcp>=1.0.0",
]
mcp-http = [
    "mcp>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
]
all = [
    "flightfinder[dev,mcp,mcp-http]",
]

[project.scripts]
flights = "flightfinder.cli:main"
flightfinder-mcp-http = "flightfinder.mcp_http_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require network)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["flightfinder"]
