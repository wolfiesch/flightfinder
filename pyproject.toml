[project]
name = "flightfinder"
version = "0.2.0"
description = "Python client for searching flights via Kiwi/Skypicker API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
flights = "flightfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
